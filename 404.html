<style>
  :root{
    --void:#0A0C0F;
    --panel:#14171C;
    --line:#262B33;
    --text:#ECEEF1;
    --text-mid:#A6ACB6;
    --text-dim:#5E6570;
    --signal:#00E5C7;
    --signal-dim:#0B4A44;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--void);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100vh;
  }
  a{color:var(--signal);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .nav{position:sticky;top:0;z-index:50;background:rgba(10,12,15,0.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{max-width:1180px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;}
  .logo{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:0.02em;display:flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 3px var(--signal-dim);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.45;}}

  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:0.12em;color:var(--signal);text-transform:uppercase;margin:0 0 18px;}
  .code{font-family:var(--font-display);font-weight:700;font-size:88px;margin:0 0 8px;line-height:1;
    background:repeating-linear-gradient(135deg, var(--panel) 0 10px, var(--text-dim) 10px 11px);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0.9;}
  h1{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0 0 14px;color:var(--text);}
  p{font-size:14.5px;color:var(--text-mid);max-width:420px;line-height:1.6;margin:0 0 28px;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{
    font-family:var(--font-mono);font-size:13px;padding:11px 20px;border-radius:6px;
    border:1px solid var(--line);color:var(--text-mid);
  }
  .btn:hover{border-color:var(--text-dim);color:var(--text);text-decoration:none;}
  .btn.primary{background:var(--signal);border-color:var(--signal);color:var(--void);font-weight:700;}
  .btn.primary:hover{color:var(--void);opacity:0.9;}

  footer{padding:24px 32px;color:var(--text-dim);font-size:12px;font-family:var(--font-mono);
    border-top:1px solid var(--line);text-align:center;}
</style>
